name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Initial bootstrap can build even before the Gradle wrapper JAR is committed.
      # Once scripts/init-gradle-wrapper.sh has been run on the LXC, CI automatically
      # prefers ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test, lint and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./gradlew ]]; then
            GRADLE=./gradlew
          else
            GRADLE=gradle
          fi
          "$GRADLE" --no-daemon test lint assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mupibox-control-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
